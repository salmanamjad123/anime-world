# Cloudflare Worker: HLS/Video proxy for anime-world
# Deploy: cd cf-worker && npx wrangler deploy
# Docs: https://developers.cloudflare.com/workers/

name = "anime-world-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# After deploy: https://anime-world-proxy.<your-subdomain>.workers.dev/proxy
# Set NEXT_PUBLIC_PROXY_URL to that /proxy URL (Railway stays for API only).
